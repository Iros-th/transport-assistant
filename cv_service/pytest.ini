[pytest]
testpaths = tests
addopts = -q
# Note: on a normal Windows/Linux checkout, `python -m pytest cv_service/tests`
# just works. (The build sandbox mounts the repo over a network-style FS whose
# recursive tmp cleanup can hit Python's recursion limit AFTER tests pass — a
# teardown artifact of that mount only, not a test failure. If you ever see it,
# run with `--basetemp=<a native temp dir>`.)
